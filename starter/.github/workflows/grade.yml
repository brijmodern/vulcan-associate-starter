# Example grading workflow for a candidate's lab repository.
# Copy to <candidate-repo>/.github/workflows/grade.yml (the starter already ships it).
#
# Triggers on tags `submission-*`, starts a fresh Postgres warehouse as a service,
# runs the private grader image (which contains the hidden tests), uploads the
# report as an artifact and writes report.md to the job summary.
#
# Required repository/organisation settings:
#   secrets.GRADER_REGISTRY_USER / secrets.GRADER_REGISTRY_TOKEN  read access to the private grader image
#   vars.ASSIGNED_SEED   (optional) the candidate's dataset seed, enables the dataset-match check
name: grade-submission

on:
  push:
    tags:
      - "submission-*"
  workflow_dispatch:

concurrency:
  group: grade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/tmdc-io/vulcan-associate-grader:1.0.0
      credentials:
        username: ${{ secrets.GRADER_REGISTRY_USER }}
        password: ${{ secrets.GRADER_REGISTRY_TOKEN }}
    services:
      # Reachable from the job container as host `warehouse`, port 5432.
      warehouse:
        image: postgres:15
        env:
          POSTGRES_USER: vulcan
          POSTGRES_PASSWORD: vulcan
          POSTGRES_DB: warehouse
        options: >-
          --health-cmd "pg_isready -U vulcan -d warehouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      VULCAN_CMD: vulcan                 # vulcan is native inside the grader image
      GRADER_PG_HOST: warehouse
      GRADER_PG_PORT: "5432"
      GRADER_PG_DB: warehouse
      GRADER_PG_USER: vulcan
      GRADER_PG_PASSWORD: vulcan
      GRADER_STATE_TYPE: duckdb
      ASSIGNED_SEED: ${{ vars.ASSIGNED_SEED }}
    steps:
      - name: Check out submission
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grade
        id: grade
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          SEED_ARG=()
          if [ -n "${ASSIGNED_SEED}" ]; then SEED_ARG=(--assigned-seed "${ASSIGNED_SEED}"); fi
          python3 /grader/grade.py \
            --submission "$GITHUB_WORKSPACE" \
            --out "$GITHUB_WORKSPACE/grading-output" \
            --env grading \
            "${SEED_ARG[@]}"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/grading-output/report.md" ]; then
            cat "$GITHUB_WORKSPACE/grading-output/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Grader produced no report -- see the Grade step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload grading report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grading-report
          path: grading-output/
          if-no-files-found: warn
          retention-days: 90
